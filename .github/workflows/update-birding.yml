name: Update birding data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  update-birding:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch eBird observations
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          curl -L \
            -H "X-eBirdApiToken: $EBIRD_API_KEY" \
            "https://api.ebird.org/v2/data/obs/Mjg0MDM3OQ/recent?maxResults=20" \
            -o ebird-response.json

      - name: Create bird-data.json
        run: |
          python - <<'PY'
          import json

          with open("ebird-response.json") as f:
              observations = json.load(f)

          sightings = []

          for obs in observations:
              sightings.append({
                  "species": obs.get("comName", ""),
                  "location": obs.get("locName", ""),
                  "date": obs.get("obsDt", "").split(" ")[0]
              })

          with open("bird-data.json", "w") as f:
              json.dump(sightings, f, indent=4)

          print(f"Saved {len(sightings)} sightings.")
          PY

      - name: Commit updated bird data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bird-data.json

          git diff --cached --quiet || git commit -m "Update birding data"

          git push
